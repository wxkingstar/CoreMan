stages: [lint, test, build]

variables:
  UV_CACHE_DIR: .uv-cache
  POSTGRES_DB: coreman_test
  POSTGRES_USER: coreman
  POSTGRES_PASSWORD: coreman
  TEST_DATABASE_URL: postgresql+asyncpg://coreman:coreman@postgres:5432/coreman_test

.python:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen --all-groups

python-lint:
  extends: .python
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy coreman

python-test:
  extends: .python
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  script:
    - uv run pytest -q
    - DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head
    - DATABASE_URL=$TEST_DATABASE_URL uv run alembic check

web-test:
  image: node:22
  stage: test
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [web/node_modules]
  script:
    - cd web
    - npm ci
    - npm run lint
    - npx vitest run
    - npm run build
  artifacts:
    paths: [web/dist]
    expire_in: 1 day

docker-build:
  image: docker:27
  stage: build
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  script:
    - docker build -f deploy/Dockerfile.api -t coreman-api:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} .
    - docker build -f deploy/Dockerfile.runtime -t coreman-runtime:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} .

# V1/Codex regression checks precede release packaging in Dockerfile.api.
runtime-drivers-test:
  image: golang:1.24-bookworm
  stage: test
  script:
    - cd runtime_daemon/drivers
    - go test ./...
