global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: coreman-api
    static_configs:
      - targets: [api-1:8000, api-2:8000]
  - job_name: coreman-worker
    static_configs:
      - targets: [worker-a:9103, worker-b:9103]
  - job_name: coreman-scheduler
    static_configs:
      - targets: [scheduler:9104]
  - job_name: coreman-wecom
    dns_sd_configs:
      - names: [gateway-wecom-a, gateway-wecom-b]
        type: A
        port: 9101
  - job_name: coreman-feishu
    dns_sd_configs:
      - names: [gateway-feishu-a, gateway-feishu-b]
        type: A
        port: 9102
