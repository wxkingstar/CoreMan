name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  images:
    name: Publish coreman-${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        # GHCR repository names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coreman-${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # The raw git tag (v1.2.3) matches what `deploy/coreman upgrade all <tag>` expects locally.
          # Pre-release tags (v1.2.3-rc.1) never move `latest`.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=coreman-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=coreman-${{ matrix.image }}

  runtime-bundles:
    name: Attach runtime bundles to the release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract bundles from the published API image
        env:
          TAG: ${{ github.ref_name }}
        # The API image serves these bundles to runtime nodes, so the release assets are
        # copied out of that exact image instead of being rebuilt separately.
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coreman-api:${TAG}"
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --platform linux/amd64 "$image")"
          mkdir -p dist
          docker cp "$cid:/app/runtime_daemon/dist/." dist/
          docker rm "$cid" >/dev/null
          cd dist
          shopt -s nullglob
          bundles=(coreman-runtime-*.tar.gz)
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::no runtime bundles found in $image"
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            expected="$(tr -d '[:space:]' < "$bundle.sha256")"
            actual="$(sha256sum "$bundle" | cut -d' ' -f1)"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::checksum mismatch for $bundle"
              exit 1
            fi
          done
          sha256sum "${bundles[@]}" > SHA256SUMS
          ls -l
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
